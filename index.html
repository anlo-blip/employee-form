<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>تم إيقاف النموذج</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#172033;font-family:Tahoma,Arial,sans-serif;padding:24px}
main{width:min(620px,100%);background:#fff;border:1px solid #d9e1ee;border-radius:20px;padding:44px 30px;text-align:center;box-shadow:0 12px 40px rgba(18,38,63,.07)}
.icon{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 22px;border-radius:50%;background:#fff4e5;color:#9a5900;font-size:38px}
h1{font-size:clamp(24px,4vw,32px);margin:0 0 20px}
p{font-size:17px;line-height:2;margin:0 0 12px}
.note{color:#667085;font-size:14px}
</style>
</head>
<body>
<main role="main">
<div class="icon" aria-hidden="true">!</div>
<h1>تم إيقاف النموذج</h1>
<p>نفيدكم بأنه تم إيقاف العمل بهذا النموذج، وسيتم تزويدكم برابط بديل قريبًا.</p>
<p class="note">لم يعد النموذج متاحًا لاستقبال البيانات أو المرفقات.</p>
</main>
</body>
</html>
